# docker-compose.yml
version: "3.9"
services:
  e_d_a_ubiquitous:
    build:
      context: .
      dockerfile: ../E.D.A.Ubiquitous/Dockerfile
      args:
        BUILD_CONFIGURATION: "Release"
        APP_UID: "1000"
    image: e.d.a.ubiquitous:latest
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_URLS=http://+:8080;http://+:8081
    restart: unless-stopped
